name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Create the GitHub Release as a PRERELEASE for this tag.
      # Tolerant of an already-existing release (re-runs / retags) so the
      # job is idempotent and does not fail the workflow.
      - name: Create prerelease (idempotent)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; ensuring it is marked prerelease."
            gh release edit "$GITHUB_REF_NAME" --prerelease
          else
            gh release create "$GITHUB_REF_NAME" \
              --prerelease \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

  upload-assets:
    name: Build and upload (${{ matrix.target }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,   os: ubuntu-latest }
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin,        os: macos-13 }
          - { target: aarch64-apple-darwin,       os: macos-latest }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin the host toolchain explicitly instead of relying on whatever
      # stable the runner image happens to ship (reproducibility + parity
      # with ci.yml). The upload action runs `rustup target add` itself for
      # native targets; cross targets build inside Docker so this host
      # toolchain is irrelevant to them and cannot conflict.
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # Builds, archives, checksums and uploads the binary to the release.
      # The action auto-detects targets that need `cross` (musl + aarch64
      # Linux) and installs/invokes it, so the rusqlite "bundled" SQLite C
      # amalgamation cross-compiles via cross's Docker images with no manual
      # apt-get. `locked: true` reuses the committed Cargo.lock, which pins
      # the ring TLS backend (NOT aws-lc-sys) — load-bearing, since aws-lc-sys
      # would break the musl/aarch64 cross builds (CMake + NASM).
      - name: Upload Rust binary
        uses: taiki-e/upload-rust-binary-action@v1.30.2
        with:
          bin: memento
          target: ${{ matrix.target }}
          archive: memento-$tag-$target
          checksum: sha256
          locked: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
