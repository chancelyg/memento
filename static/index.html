<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{SLOGAN}}" />
  <title>{{SITE_NAME}}</title>
  <link rel="stylesheet" href="/static/site-shell.css" />
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon" href="{{ICON}}" />
</head>
<body data-page="collection">
  <!-- Ambient glow layer (decorative) -->
  <div class="ambient" aria-hidden="true"></div>

  <header class="site-header">
    <nav class="site-nav" aria-label="主导航">
      <a class="site-brand" href="/" aria-label="{{SITE_NAME}} 首页">
        <span class="site-brand__icon-wrap" aria-hidden="true">
          <img class="site-brand__icon" src="{{ICON}}" alt="" />
          <span class="site-brand__mark"></span>
        </span>
        <span class="site-brand__name">{{SITE_NAME}}</span>
      </a>
      <a class="site-link" data-nav-page="collection" href="/">收藏</a>
      <a class="site-link" data-nav-page="diary" href="/diary">日记</a>
      <div class="nav-future" aria-hidden="true"></div>
      <button id="themeToggle" class="theme-toggle" type="button"
              aria-label="切换浅色 / 深色主题" title="切换主题">☾</button>
      <a id="shellAccount" class="site-account" href="/login">账户</a>
    </nav>
  </header>

  <main class="container" role="main">
    <!-- Editorial hero -->
    <section class="hero">
      <p class="hero__eyebrow">收藏 · COLLECTION</p>
      <h1 class="hero__title">我的收藏</h1>
      <p class="hero__subtitle">{{SLOGAN}}</p>
    </section>

    <!-- Filter chips -->
    <section class="controls" aria-label="筛选">
      <div class="pills" aria-label="类型筛选">
        <button class="pill is-active" type="button" aria-pressed="true" data-type="all">全部</button>
        <button class="pill" type="button" aria-pressed="false" data-type="game"><span class="pill__emoji" aria-hidden="true">🎮</span> 游戏</button>
        <button class="pill" type="button" aria-pressed="false" data-type="book"><span class="pill__emoji" aria-hidden="true">📚</span> 图书</button>
        <button class="pill" type="button" aria-pressed="false" data-type="movie"><span class="pill__emoji" aria-hidden="true">🎬</span> 电影</button>
      </div>
      <p id="countLine" class="count-line" aria-live="polite"></p>
    </section>

    <!-- Poster wall -->
    <section id="grid" class="grid" aria-label="收藏海报墙" aria-busy="false"></section>

    <!-- Empty state -->
    <div id="emptyState" class="empty" hidden>
      <div class="empty__art" aria-hidden="true">🗃️</div>
      <p class="empty__text">还没有收藏，快通过 API 添加吧～</p>
    </div>

    <!-- Load more -->
    <div class="loadmore-wrap">
      <button id="loadMore" class="loadmore" type="button" hidden>加载更多收藏…</button>
    </div>
  </main>

  <!-- Detail modal (glass over ambient backdrop) -->
  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__ambient" id="modalAmbient" aria-hidden="true"></div>
    <div class="modal__panel" role="document">
      <button class="modal__close" type="button" aria-label="关闭" data-close>✕</button>
      <div class="modal__body">
        <div class="modal__poster">
          <img id="modalImg" class="modal__img" alt="" />
        </div>
        <div class="modal__info">
          <span id="modalBadge" class="badge"></span>
          <h2 id="modalTitle" class="modal__title"></h2>
          <p id="modalAka" class="modal__aka"></p>
          <div id="modalRating" class="modal__rating" hidden>
            <span class="modal__rating-stars" aria-hidden="true">
              <span class="modal__rating-fill"></span>
            </span>
            <span class="modal__rating-num"></span>
          </div>
          <p id="modalSummary" class="modal__summary"></p>
          <dl id="modalFields" class="fields"></dl>
          <a id="modalLink" class="source-btn" target="_blank" rel="noopener" hidden>前往源页面 ↗</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="alert" hidden></div>

  <script src="/static/site-shell.js" defer></script>
  <script src="/static/app.js" defer></script>
</body>
</html>
