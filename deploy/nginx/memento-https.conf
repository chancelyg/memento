# 可选公网 HTTPS 方案：在 nginx.conf 的 http {} 内 include 本文件。
# 与 memento.conf 二选一，重复 zone/upstream 不能同时启用。
# 替换 server_name 和证书路径，证书须覆盖自己的 HTTPS 名或 IP。
# 应用 bind=127.0.0.1:23457，PUBLIC_ORIGIN=https://自己的HTTPS名。
# 不让登录限流阻止会话查询或退出。
map $request_method $memento_login_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $memento_login_key zone=memento_login:10m rate=10r/m;
upstream memento_backend {
    server 127.0.0.1:23457;
}
server {
    listen 80;
    server_name diary.example.test;
    access_log off;
    error_log /var/log/nginx/memento-error.log warn;
    client_max_body_size 20m;
    # 使用固定的实际 HTTPS 名，不从任意请求 Host 构造跳转地址。
    return 308 https://diary.example.test$request_uri;
}
server {
    listen 443 ssl;
    server_name diary.example.test;
    ssl_certificate /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    # 错误日志及上级日志仍可能包含 URI；不启用 debug/trace 或正文采样。
    error_log /var/log/nginx/memento-error.log warn;
    client_max_body_size 20m;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Origin $http_origin;
    # 认证、Cookie、CSRF、If-Match 和响应头默认透传。
    proxy_cache off;
    proxy_buffering off;
    proxy_next_upstream off;
    limit_req_status 429;

    location = /session {
        client_max_body_size 8k;
        # 两步登录共享限流；rate/burst 可调，不信任客户端伪造的转发头。
        limit_req zone=memento_login burst=10 nodelay;
        proxy_pass http://memento_backend;
    }
    location ~ ^/(api|private)/diaries(?:/|$) {
        client_max_body_size 64k;
        proxy_pass http://memento_backend;
    }
    location / {
        proxy_pass http://memento_backend;
    }
}
