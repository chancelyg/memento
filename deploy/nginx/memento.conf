# HTTP 内网方案：在 nginx.conf 的 http {} 内 include 本文件（如 conf.d）。
# 不是 main 上下文的完整 nginx.conf；与 HTTPS 示例二选一，不能同时启用。
# 应用：MEMENTO_BIND=127.0.0.1:23457
# MEMENTO_PUBLIC_ORIGIN=http://机器IP:8080，无需域名或证书。
# 只限制密码/验证码提交；空 key 不计入限流，不阻挡会话查询和退出。
map $request_method $memento_login_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $memento_login_key zone=memento_login:10m rate=10r/m;
upstream memento_backend {
    server 127.0.0.1:23457;
}
server {
    listen 8080;
    server_name _;
    access_log off;
    # warn 不记录正文/认证头；错误日志仍可能包含 URI，须限制日志访问。
    error_log /var/log/nginx/memento-error.log warn;
    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    # Cookie、X-CSRF-Token、If-Match、X-API-Key 默认透传，不改写可信来源。
    proxy_cache off;
    proxy_buffering off;
    proxy_next_upstream off;
    limit_req_status 429;

    location = /session {
        client_max_body_size 8k;
        # 密码和 OTP 共用入口额度；10r/m、burst=10 可按个人使用情况调整。
        # 直接面向客户端；若前面另有代理，须另行设计可信客户端 IP 边界。
        limit_req zone=memento_login burst=10 nodelay;
        proxy_pass http://memento_backend;
    }
    location ~ ^/(api|private)/diaries(?:/|$) {
        client_max_body_size 64k;
        proxy_pass http://memento_backend;
    }
    location / {
        # 无 URI 后缀、不 rewrite、不用 SPA fallback，保留路径和 API 404。
        proxy_pass http://memento_backend;
    }
}
